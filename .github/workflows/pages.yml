name: Deploy MuJoCo WASM demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "third_party/booster_assets/**"
      - "web/mujoco_wasm/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/mujoco_wasm/package-lock.json
      - name: Install dependencies
        working-directory: web/mujoco_wasm
        run: npm ci
      - name: Build demo
        working-directory: web/mujoco_wasm
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/mujoco_wasm/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
